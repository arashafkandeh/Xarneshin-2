<!-- templates/node_installer.html -->

<!-- Add Node Modal -->
<div id="addNodeModal" class="fixed inset-0 bg-black bg-opacity-75 hidden z-50 flex items-center justify-center px-4">
  <div class="glass-effect rounded-lg p-6 sm:p-8 w-full max-w-lg md:max-w-2xl shadow-xl transform transition-all sm:my-8 opacity-0 translate-y-10 overflow-y-auto max-h-[85vh]"
       role="dialog" aria-modal="true" aria-labelledby="addNodeModalTitle">
    <div class="flex justify-between items-center mb-6">
      <h3 id="addNodeModalTitle" class="text-xl sm:text-2xl font-bold text-cyan-400">Add New Node via SSH</h3>
      <button type="button" onclick="closeAddNodeModal()"
              class="text-gray-400 hover:text-gray-200 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <form id="addNodeForm">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
        <div>
          <label for="nodeName" class="block text-sm font-medium text-gray-300 mb-1">Node Name</label>
          <input type="text" id="nodeName" name="nodeName" required
                 class="w-full p-2.5 bg-gray-800/60 text-gray-100 rounded-lg border border-gray-700 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 placeholder-gray-500 transition-colors"
                 placeholder="e.g., My Awesome Server">
        </div>
        <div>
          <label for="serverIP" class="block text-sm font-medium text-gray-300 mb-1">Server IP Address</label>
          <input type="text" id="serverIP" name="serverIP" required
                 class="w-full p-2.5 bg-gray-800/60 text-gray-100 rounded-lg border border-gray-700 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 placeholder-gray-500 transition-colors"
                 placeholder="e.g., 192.168.1.100">
        </div>
        <div>
          <label for="sshUser" class="block text-sm font-medium text-gray-300 mb-1">SSH Username</label>
          <input type="text" id="sshUser" name="sshUser" value="root" required
                 class="w-full p-2.5 bg-gray-800/60 text-gray-100 rounded-lg border border-gray-700 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 placeholder-gray-500 transition-colors"
                 placeholder="e.g., root or admin">
        </div>
        <div>
          <label for="sshPassword" class="block text-sm font-medium text-gray-300 mb-1">SSH Password</label>
          <input type="password" id="sshPassword" name="sshPassword" required
                 class="w-full p-2.5 bg-gray-800/60 text-gray-100 rounded-lg border border-gray-700 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 placeholder-gray-500 transition-colors"
                 placeholder="Enter SSH password">
        </div>
        <div class="md:col-span-2">
          <label for="sshPort" class="block text-sm font-medium text-gray-300 mb-1">SSH Port</label>
          <input type="number" id="sshPort" name="sshPort" value="22" required
                 class="w-full p-2.5 bg-gray-800/60 text-gray-100 rounded-lg border border-gray-700 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 placeholder-gray-500 transition-colors"
                 placeholder="Default: 22">
        </div>
      </div>

      <!-- Node Certificate -->
      <div class="mt-6">
        <label for="nodeCertificate" class="block text-sm font-medium text-gray-300 mb-1">Node Certificate <span class="text-red-500">*</span></label>
        <textarea id="nodeCertificate" name="nodeCertificate" rows="5"
                  class="w-full p-2.5 bg-gray-800/60 text-gray-100 rounded-lg border border-gray-700 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 placeholder-gray-500 transition-colors"
                  placeholder="-----BEGIN CERTIFICATE----- ... -----END CERTIFICATE-----"></textarea>
        <div class="mt-2 flex items-center justify-between">
            <button type="button" id="saveCertificateBtn" onclick="saveCertificate()"
                    class="px-3 py-1.5 rounded-md text-xs font-medium text-white bg-sky-600 hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 transition-colors neon-hover">
              Save as Default
            </button>
            <span id="certificateMessage" class="text-xs text-green-400 ml-2"></span>
        </div>
      </div>

      <!-- Node Port and Xray Version -->
      <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
        <div>
          <label for="nodeXrayPort" class="block text-sm font-medium text-gray-300 mb-1">Node Xray Port</label>
          <input type="number" id="nodeXrayPort" name="nodeXrayPort"
                 class="w-full p-2.5 bg-gray-800/60 text-gray-100 rounded-lg border border-gray-700 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 placeholder-gray-500 transition-colors"
                 placeholder="e.g., 443 (Required for auto-add)">
        </div>
        <div>
           <label for="xrayVersionSelect" class="block text-sm font-medium text-gray-300 mb-1">Xray Version <span class="text-red-500">*</span></label>
          <select id="xrayVersionSelect" name="xrayVersionSelect"
                  class="w-full p-2.5 bg-gray-800/60 text-gray-100 rounded-lg border border-gray-700 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-colors">
            <option value="">Loading versions...</option>
            <!-- Options will be populated by JavaScript -->
          </select>
        </div>
      </div>

      <!-- Proxy Toggle -->
      <div class="mt-6 mb-4 flex items-center">
        <label for="useProxy" class="flex items-center cursor-pointer">
          <div class="relative">
            <input type="checkbox" id="useProxy" name="useProxy" class="sr-only peer">
            <div class="w-10 h-6 bg-gray-600 rounded-full shadow-inner peer-checked:bg-purple-600 transition-colors"></div>
            <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform peer-checked:translate-x-full"></div>
          </div>
          <div class="ml-3 text-sm font-medium text-gray-300">Iran Node (Use Proxy)</div>
        </label>
      </div>

      <!-- Proxy Fields (hidden by default) -->
      <div id="proxyFieldsContainer" class="hidden mt-4 p-4 border border-gray-700 rounded-lg bg-gray-800/30">
        <h4 class="text-md font-semibold text-purple-400 mb-3">SOCKS5 Proxy Settings</h4>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
          <div>
            <label for="proxyIP" class="block text-sm font-medium text-gray-300 mb-1">Proxy IP Address</label>
            <input type="text" id="proxyIP" name="proxyIP"
                   class="w-full p-2.5 bg-gray-800/60 text-gray-100 rounded-lg border border-gray-700 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 placeholder-gray-500 transition-colors"
                   placeholder="e.g., 127.0.0.1">
          </div>
          <div>
            <label for="proxyPort" class="block text-sm font-medium text-gray-300 mb-1">Proxy Port</label>
            <input type="number" id="proxyPort" name="proxyPort"
                   class="w-full p-2.5 bg-gray-800/60 text-gray-100 rounded-lg border border-gray-700 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 placeholder-gray-500 transition-colors"
                   placeholder="e.g., 1080">
          </div>
          <div>
            <label for="proxyUser" class="block text-sm font-medium text-gray-300 mb-1">Proxy Username <span class="text-xs text-gray-500">(Optional)</span></label>
            <input type="text" id="proxyUser" name="proxyUser"
                   class="w-full p-2.5 bg-gray-800/60 text-gray-100 rounded-lg border border-gray-700 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 placeholder-gray-500 transition-colors"
                   placeholder="Proxy username">
          </div>
          <div>
            <label for="proxyPassword" class="block text-sm font-medium text-gray-300 mb-1">Proxy Password <span class="text-xs text-gray-500">(Optional)</span></label>
            <input type="password" id="proxyPassword" name="proxyPassword"
                   class="w-full p-2.5 bg-gray-800/60 text-gray-100 rounded-lg border border-gray-700 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 placeholder-gray-500 transition-colors"
                   placeholder="Proxy password">
          </div>
          <div class="md:col-span-2 flex items-center justify-between mt-2">
            <div class="flex items-center space-x-2">
              <button type="button" id="testConnectionBtn" onclick="testSshAndProxyConnection()"
                      class="px-4 py-2 rounded-lg text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-500 transition-colors neon-hover">
                Test Proxy
              </button>
              <span id="proxyTestResult" class="text-sm text-gray-400"></span>
            </div>
            <a href="https://github.com/ArashAfkandeh/Microsocks" target="_blank" rel="noopener noreferrer"
               class="inline-block px-4 py-2 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors neon-hover">
              Setup Proxy
            </a>
          </div>
        </div>
      </div>

      <div class="flex justify-end space-x-4 mt-8">
        <button type="button" onclick="closeAddNodeModal()"
                class="px-6 py-2.5 rounded-lg text-sm font-medium text-gray-300 bg-gray-700 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors neon-hover">
          Cancel
        </button>
        <button type="submit"
                class="px-6 py-2.5 rounded-lg text-sm font-medium text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 focus:ring-offset-gray-900 transition-colors neon-hover">
          Save Node
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Node Setup Progress Modal (Updated for 80% responsive size) -->
<div id="setupProgressModal" class="fixed inset-0 bg-black bg-opacity-75 hidden z-50 flex items-center justify-center p-4 sm:p-6">
  <div class="glass-effect rounded-lg p-6 sm:p-8 shadow-xl flex flex-col w-full h-[80vh] max-w-6xl">
    <h3 class="text-xl sm:text-2xl font-bold text-cyan-400 mb-4 flex-shrink-0">Node Setup Progress</h3>
    
    <!-- Log display box -->
    <div class="bg-gray-900/70 p-4 rounded-lg flex-grow overflow-y-auto mb-4">
      <pre id="setupOutputArea" class="text-sm text-gray-200 whitespace-pre-wrap break-all"></pre>
    </div>
    
    <p id="setupStatusMessage" class="text-sm text-gray-400 mb-6 flex-shrink-0">Connecting to server...</p>
    <div class="flex justify-between items-center flex-shrink-0">
        <span id="telegramReportMessage" class="text-sm text-yellow-300 hidden">Error report sent to Developer.</span>

          <button type="button" id="copySetupLogBtn" 
                  class="px-6 py-2.5 rounded-lg text-sm font-medium text-white bg-sky-600 hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 transition-colors neon-hover hidden">

          <button type="button" id="closeSetupProgressModalBtn" onclick="closeSetupProgressModal()"

            Close

<script>
// Add Node Modal Functions
const addNodeModal = document.getElementById('addNodeModal');
const addNodeForm = document.getElementById('addNodeForm');
const addNodeModalContent = addNodeModal.querySelector('.glass-effect');
const useProxyCheckbox = document.getElementById('useProxy');
const proxyFieldsContainer = document.getElementById('proxyFieldsContainer');
const proxyTestResultSpan = document.getElementById('proxyTestResult');
const nodeCertificateTextarea = document.getElementById('nodeCertificate');
const certificateMessageSpan = document.getElementById('certificateMessage');
const nodeXrayPortInput = document.getElementById('nodeXrayPort');
const xrayVersionSelect = document.getElementById('xrayVersionSelect');
let nodeSetupEventSource = null;

function toggleProxyFields() {
  if (useProxyCheckbox.checked) {
    proxyFieldsContainer.classList.remove('hidden');
  } else {
    proxyFieldsContainer.classList.add('hidden');
  }
}

useProxyCheckbox.addEventListener('change', toggleProxyFields);

function saveCertificate() {
  const certificateValue = nodeCertificateTextarea.value;
  localStorage.setItem('defaultNodeCertificate', certificateValue);
  certificateMessageSpan.textContent = 'Default certificate saved!';
  certificateMessageSpan.className = 'text-xs text-green-400 ml-2';
  setTimeout(() => {
    certificateMessageSpan.textContent = '';
  }, 3000);
}

function openAddNodeModal() {
  addNodeForm.reset();
  proxyTestResultSpan.textContent = '';
  certificateMessageSpan.textContent = '';
  nodeXrayPortInput.value = '';

  const defaultCertificate = localStorage.getItem('defaultNodeCertificate');
  nodeCertificateTextarea.value = defaultCertificate || '';

  useProxyCheckbox.checked = false;
  toggleProxyFields();

  document.getElementById('proxyIP').value = localStorage.getItem('defaultProxyIP') || '';
  document.getElementById('proxyPort').value = localStorage.getItem('defaultProxyPort') || '';
  document.getElementById('proxyUser').value = localStorage.getItem('defaultProxyUser') || '';
  document.getElementById('proxyPassword').value = localStorage.getItem('defaultProxyPassword') || '';

  populateXrayVersionsDropdown();

  addNodeModal.classList.remove('hidden');
  setTimeout(() => {
    addNodeModalContent.classList.remove('opacity-0', 'translate-y-10');
    addNodeModalContent.classList.add('opacity-100', 'translate-y-0');
  }, 10);
}

function closeAddNodeModal() {
  addNodeModalContent.classList.remove('opacity-100', 'translate-y-0');
  addNodeModalContent.classList.add('opacity-0', 'translate-y-10');
  setTimeout(() => {
    addNodeModal.classList.add('hidden');
  addNodeForm.reset(); 
  }, 300);
}

addNodeForm.addEventListener('submit', function(event) {
  event.preventDefault();
  saveNodeWithStreaming();
});

function saveNodeWithStreaming() {
  const formData = new FormData(addNodeForm);
  const data = Object.fromEntries(formData.entries());
  data.useProxy = useProxyCheckbox.checked;
  data.nodeXrayPort = nodeXrayPortInput.value;
  data.selectedXrayVersion = xrayVersionSelect.value;
  
  const submitButton = addNodeForm.querySelector('button[type="submit"]');

  try {
    data.nodeCertificate = btoa(nodeCertificateTextarea.value.trim());
  } catch (e) {
    showNotification('Error encoding certificate. Please ensure it is valid text.');
    console.error("Certificate encoding error:", e);
    return;
  }

  const requiredFields = {
    "Node Name": data.nodeName, "Server IP": data.serverIP,
    "SSH Username": data.sshUser, "SSH Password": data.sshPassword, "SSH Port": data.sshPort,
    "Node Certificate": data.nodeCertificate, "Xray Version": data.selectedXrayVersion
  };

  for (const [fieldName, value] of Object.entries(requiredFields)) {
    if (!value) {
      showNotification(`Please fill in the '${fieldName}' field.`);
      return;
    }
  }

  if (data.useProxy && (!data.proxyIP || !data.proxyPort)) {
    showNotification('Proxy IP and Port are required when proxy is enabled.');
    return;
  }

  submitButton.disabled = true;
  submitButton.innerHTML = `
    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    Connecting...
  `;
  
  closeAddNodeModal();
  openSetupProgressModal();

  const setupOutputArea = document.getElementById('setupOutputArea');
  const setupStatusMessage = document.getElementById('setupStatusMessage');
  const closeSetupBtn = document.getElementById('closeSetupProgressModalBtn');
  const copyLogBtn = document.getElementById('copySetupLogBtn');
  const telegramMessageSpan = document.getElementById('telegramReportMessage');

  copyLogBtn.onclick = copySetupLog;

  fetch('/add_node_ssh', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(response => {
    if (!response.ok) {
      return response.json().then(errData => {
        throw new Error(errData.message || `Server error: ${response.status}`);
      }).catch(() => {
        throw new Error(`Server error: ${response.status}`);
      });
    }
    
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    setupStatusMessage.textContent = 'Setup in progress...';

    function processStream() {
      reader.read().then(({ done, value }) => {
        if (done) {
          setupStatusMessage.textContent = 'Stream ended.';
          if (!setupStatusMessage.textContent.includes("Successfully") && !setupStatusMessage.textContent.includes("Failed")) {
             setupStatusMessage.textContent = 'Setup process finished or connection closed unexpectedly.';
          }
          closeSetupBtn.classList.remove('hidden');
          submitButton.disabled = false;
          submitButton.innerHTML = 'Save Node';
          return;
        }

        const chunk = decoder.decode(value, { stream: true });
        chunk.split('\n\n').forEach(eventString => {
          if (eventString.startsWith('data: ')) {
            try {
              const eventData = JSON.parse(eventString.slice(6));
              let currentOutput = setupOutputArea.textContent;
              let lineContent = "";

              if (eventData.line) {
                lineContent = eventData.line;
              } else if (eventData.error_line) {
                lineContent = `ERROR: ${eventData.error_line}`;
              }
              
              if (lineContent) {
                const ansiRegex = /[\u001B\u009B][[()#;?]*.{0,2}(?:[0-9]{1,4}(?:;[0-9]{0,4})*)?[0-9A-ORZcf-nqry=><~]/g;
                let cleanedLineContent = lineContent.replace(ansiRegex, '');

                if (cleanedLineContent.includes('\r')) {
                    let lines = currentOutput.split('\n');
                    if (lines.length > 0 && lines[lines.length - 1] === '') {
                        lines.pop();
                    }
                    if (lines.length > 0) {
                        lines.pop(); 
                    }
                    currentOutput = lines.join('\n');
                    if (lines.length > 0 || currentOutput.length > 0) {
                        currentOutput += '\n';
                    }
                }
                
                cleanedLineContent = cleanedLineContent.replace(/\r/g, '');

                if (cleanedLineContent.length > 0) {
                   setupOutputArea.textContent = currentOutput + cleanedLineContent + '\n';
                }
                setupOutputArea.scrollTop = setupOutputArea.scrollHeight;
              } else if (eventData.status === 'completed') {
                const finalLogText = setupOutputArea.textContent;
                const copyIconSvg = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>`;
                const successMessageHtml = `
                  <p class="mb-4">${eventData.message || 'Node setup script completed successfully!'}</p>
                  <div class="flex items-center justify-between mb-2">
                    <span><strong>Server IP:</strong> <code class="bg-gray-900/70 text-cyan-300 px-1.5 py-0.5 rounded">${data.serverIP}</code></span>
                    <button onclick="copyToClipboard('${data.serverIP}', this)" class="p-1.5 rounded-md bg-gray-700 hover:bg-gray-600 text-gray-300 transition-colors">${copyIconSvg}</button>
                  </div>
                  <div class="flex items-center justify-between">
                    <span><strong>Node Xray Port:</strong> <code class="bg-gray-900/70 text-cyan-300 px-1.5 py-0.5 rounded">${eventData.node_details.port || 'Not specified'}</code></span>
                    <button onclick="copyToClipboard('${eventData.node_details.port || ''}', this)" class="p-1.5 rounded-md bg-gray-700 hover:bg-gray-600 text-gray-300 transition-colors">${copyIconSvg}</button>
                  </div>`;
                
                setTimeout(() => {
                    closeSetupProgressModal();
                    openSuccessInfoModal(successMessageHtml, finalLogText, eventData.node_details);
                }, 1000);

              } else if (eventData.status === 'failed') {
                setupOutputArea.textContent += `\nERROR: ${eventData.message || 'Setup failed.'}`;
                setupStatusMessage.textContent = `Setup Failed (Exit Code: ${eventData.exit_code}).`;
                closeSetupBtn.classList.remove('hidden');
                copyLogBtn.classList.remove('hidden');
                telegramMessageSpan.classList.remove('hidden');
              } else if (eventData.status === 'error') {
                setupOutputArea.textContent += `\nERROR: ${eventData.message}`;
                setupStatusMessage.textContent = 'An error occurred during setup.';
                closeSetupBtn.classList.remove('hidden');
                copyLogBtn.classList.remove('hidden');
              }
            } catch (e) {
              console.error('Error parsing stream event:', e, "Event string:", eventString);
            }
          }
        });
        processStream();
      }).catch(error => {
        console.error('Stream processing error:', error);
        setupOutputArea.textContent += `\nStream Error: ${error.message}`;
        setupStatusMessage.textContent = 'Failed to process setup stream.';
        closeSetupBtn.classList.remove('hidden');
        copyLogBtn.classList.remove('hidden');
        submitButton.disabled = false;
        submitButton.innerHTML = 'Save Node';
      });
    }
    processStream();

  })
  .catch(error => {
    console.error('Fetch error for node setup:', error);
    setupOutputArea.textContent = `Connection Error: ${error.message}`;
    setupStatusMessage.textContent = 'Failed to connect to server for setup.';
    closeSetupBtn.classList.remove('hidden');
    copyLogBtn.classList.remove('hidden');
    submitButton.disabled = false;
    submitButton.innerHTML = 'Save Node';
  });
}

async function testSshAndProxyConnection() {
  const serverIP = document.getElementById('serverIP').value;
  const sshPort = document.getElementById('sshPort').value;
  const sshUser = document.getElementById('sshUser').value;
  const sshPassword = document.getElementById('sshPassword').value;

  const useProxy = useProxyCheckbox.checked;
  const proxyIP = document.getElementById('proxyIP').value;
  const proxyPort = document.getElementById('proxyPort').value;
  const proxyUser = document.getElementById('proxyUser').value;
  const proxyPassword = document.getElementById('proxyPassword').value;

  if (!serverIP || !sshPort || !sshUser || !sshPassword) {
    proxyTestResultSpan.textContent = 'SSH IP, Port, User, and Password are required for testing.';
    proxyTestResultSpan.className = 'text-sm text-red-400';
    return;
  }
  if (useProxy && (!proxyIP || !proxyPort)) {
    proxyTestResultSpan.textContent = 'Proxy IP and Port are required when proxy is enabled for testing.';
    proxyTestResultSpan.className = 'text-sm text-red-400';
    return;
  }

  proxyTestResultSpan.textContent = 'Testing connection...';
  proxyTestResultSpan.className = 'text-sm text-yellow-400';
  const testButton = document.getElementById('testConnectionBtn');
  testButton.disabled = true;
  testButton.textContent = 'Testing...';

  const payload = {
    ssh_ip: serverIP, ssh_port: sshPort, ssh_user: sshUser, ssh_pass: sshPassword,
    use_proxy: useProxy,
    proxy_ip: proxyIP, proxy_port: proxyPort, proxy_user: proxyUser, proxy_pass: proxyPassword
  };

  try {
    const response = await fetch('/test_full_connection', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    const result = await response.json();
    let message = "";
    let overallSuccess = false;

    if (useProxy) {
      message += `Proxy: ${result.proxy_status === 'success' ? `OK (IP: ${result.proxy_seen_ip || 'N/A'})` : `Failed (${result.proxy_message || 'Error'})`} | `;
    }
    message += `SSH: ${result.ssh_status === 'success' ? 'OK' : `Failed (${result.ssh_message || 'Error'})`}`;

    if (result.ssh_status === 'success' && (result.proxy_status === 'success' || !useProxy)) {
      overallSuccess = true;
    }

    proxyTestResultSpan.textContent = message;
    proxyTestResultSpan.className = `text-sm ${overallSuccess ? 'text-green-400' : 'text-red-400'}`;

    if (overallSuccess && useProxy && result.proxy_status === 'success' && result.ssh_status === 'success') {
        localStorage.setItem('defaultProxyIP', document.getElementById('proxyIP').value);
        localStorage.setItem('defaultProxyPort', document.getElementById('proxyPort').value);
        localStorage.setItem('defaultProxyUser', document.getElementById('proxyUser').value);
        localStorage.setItem('defaultProxyPassword', document.getElementById('proxyPassword').value);
        showNotification('SOCKS Proxy details saved as default for next use. (Toggle will be off by default next time)');
    }

  } catch (error) {
    console.error('Error testing connection:', error);
    proxyTestResultSpan.textContent = `Connection Test Error: ${error.message}`;
    proxyTestResultSpan.className = 'text-sm text-red-400';
  } finally {
    testButton.disabled = false;
    testButton.textContent = 'Test Proxy';
  }
}

function openSuccessInfoModal(messageHtml, logText, nodeDetails) {
  const modal = document.getElementById('successInfoModal');
  const content = document.getElementById('successInfoContent');
  const modalContent = modal.querySelector('.glass-effect');
  const logDataTextarea = document.getElementById('successLogData');
  const copyLogButton = document.getElementById('successCopyLogBtn');
  const addToPanelButton = document.getElementById('addToPanelBtn');
  const updateNodeButton = document.getElementById('updateNodeBtn');
  const modalTitle = document.getElementById('successModalTitle');

  // Reset states from previous opens
  modalTitle.textContent = 'Node Setup Successful';
  modalTitle.className = 'text-xl font-bold text-green-400 mb-4';
  addToPanelButton.textContent = 'Add to Panel';
  addToPanelButton.classList.add('hidden');
  updateNodeButton.classList.add('hidden');
  
  content.innerHTML = messageHtml;
  logDataTextarea.value = logText;
  copyLogButton.classList.remove('hidden');

  // Show "Add to Panel" button only if details and port are available
  if (nodeDetails && nodeDetails.port) {
    addToPanelButton.dataset.nodeDetails = JSON.stringify(nodeDetails);
    updateNodeButton.dataset.nodeDetails = JSON.stringify(nodeDetails);
    
    // First, let's just show the "Add" button and let the user click it.
    // The logic to show the "Update" button will be triggered on conflict.
    addToPanelButton.classList.remove('hidden');
    
    // Let's proactively check if the node exists
    checkIfNodeExists(nodeDetails);
  }

  modal.classList.remove('hidden');
  setTimeout(() => {
    modalContent.classList.remove('opacity-0', 'translate-y-10');
    modalContent.classList.add('opacity-100', 'translate-y-0');
  }, 10);
}

async function checkIfNodeExists(nodeDetails) {
    // This is a "dry-run" to see if the node exists.
    try {
        const response = await fetch('/add_node_to_panel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...nodeDetails, force_new: false }), // We don't want to create it yet
        });

        if (response.status === 409) {
            const result = await response.json();
            const modalTitle = document.getElementById('successModalTitle');
            const updateBtn = document.getElementById('updateNodeBtn');
            const addToPanelBtn = document.getElementById('addToPanelBtn');

            // Node exists, so let's show the Update button as well
            modalTitle.textContent = 'Node Name Exists';
            modalTitle.className = 'text-xl font-bold text-amber-400 mb-4';
            
            updateBtn.classList.remove('hidden');
            updateBtn.dataset.existingNodeId = result.existing_node.id;

            // Change the text of the "Add" button to clarify it will create a new entry
            addToPanelBtn.textContent = "Add as New";
        }
    } catch (error) {
        console.error("Error during pre-check for node existence:", error);
    }
}

function closeSuccessInfoModal() {
  const modal = document.getElementById('successInfoModal');
  const modalContent = modal.querySelector('.glass-effect');
  const addToPanelButton = document.getElementById('addToPanelBtn');
  const updateNodeButton = document.getElementById('updateNodeBtn');
  
  modalContent.classList.remove('opacity-100', 'translate-y-0');
  modalContent.classList.add('opacity-0', 'translate-y-10');
  setTimeout(() => {
    modal.classList.add('hidden');
    document.getElementById('successCopyLogBtn').classList.add('hidden');
    document.getElementById('successLogData').value = '';
    
    // Reset "Add to Panel" button state
    addToPanelButton.classList.add('hidden');
    addToPanelButton.disabled = false;
    addToPanelButton.textContent = 'Add to Panel'; // Reset text
    delete addToPanelButton.dataset.nodeDetails;
    
    // Reset "Update Node" button state
    updateNodeButton.classList.add('hidden');
    updateNodeButton.disabled = false;
    updateNodeButton.textContent = 'Update Node';
    delete updateNodeButton.dataset.nodeDetails;
    delete updateNodeButton.dataset.existingNodeId;

  }, 300);
}

async function addNodeToPanel(buttonElement) {
  const nodeDetails = JSON.parse(buttonElement.dataset.nodeDetails);
  if (!nodeDetails) {
    showNotification("Node details not found.", "error");
    return;
  }

  buttonElement.disabled = true;
  buttonElement.innerHTML = `
    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    Adding...
  `;
  
  // We explicitly tell the backend to create a new one, even if the name is a duplicate.
  // The backend will handle creating a unique name (e.g., "My Node 2").
  const payload = { ...nodeDetails, force_new: true };

  try {
    const response = await fetch('/add_node_to_panel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    
    const result = await response.json();

    if (response.ok) {
      showNotification(result.message, 'success');
      buttonElement.textContent = 'Added!';
      // Also disable the update button if it exists
      const updateBtn = document.getElementById('updateNodeBtn');
      if (updateBtn) updateBtn.disabled = true;
    } else {
      showNotification(result.message || 'Failed to add node to panel.', 'error');
      buttonElement.disabled = false;
      buttonElement.textContent = 'Add as New'; // Revert text
    }
  } catch (error) {
    console.error('Error adding node to panel:', error);
    showNotification('An unexpected error occurred. Check the console.', 'error');
    buttonElement.disabled = false;
    buttonElement.textContent = 'Add as New';
  }
}

async function updateExistingNode(buttonElement) {
    const nodeDetails = JSON.parse(buttonElement.dataset.nodeDetails);
    const existingNodeId = buttonElement.dataset.existingNodeId;

    if (!nodeDetails || !existingNodeId) {
        showNotification("Data required for update is missing.", "error");
        return;
    }

    buttonElement.disabled = true;
    buttonElement.innerHTML = `
      <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      Updating...
    `;

    const payload = {
        id: parseInt(existingNodeId, 10),
        address: nodeDetails.address,
        port: nodeDetails.port,
    };

    try {
        const response = await fetch('/update_existing_node', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        const result = await response.json();

        if (response.ok) {
            showNotification(result.message, 'success');
            buttonElement.textContent = 'Updated!';
             // Also disable the add button if it exists
            const addBtn = document.getElementById('addToPanelBtn');
            if (addBtn) addBtn.disabled = true;
        } else {
            showNotification(result.message || 'Failed to update the node.', 'error');
            buttonElement.disabled = false;
            buttonElement.textContent = 'Update Node';
        }
    } catch (error) {
        console.error('Error updating node:', error);
        showNotification('An unexpected error occurred during update.', 'error');
        buttonElement.disabled = false;
        buttonElement.textContent = 'Update Node';
    }
}

function copyTextToClipboard(text, buttonElement, buttonText) {
    const originalButtonText = buttonElement.textContent;
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
            buttonElement.textContent = 'Copied!';
            buttonElement.disabled = true;
            setTimeout(() => {
                buttonElement.textContent = originalButtonText;
                buttonElement.disabled = false;
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy using navigator:', err);
            alert('Copy error. Please copy manually.');
        });
    } else {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed"; textArea.style.top = "0"; textArea.style.left = "0";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus(); textArea.select();
        try {
            document.execCommand('copy');
            buttonElement.textContent = 'Copied!';
            buttonElement.disabled = true;
            setTimeout(() => {
                buttonElement.textContent = originalButtonText;
                buttonElement.disabled = false;
            }, 2000);
        } catch (e) {
            console.error('Fallback copy method failed:', e);
            alert('Error copying using the alternate method. Please copy manually.');
        }
        document.body.removeChild(textArea);
    }
}

function copyToClipboard(text, buttonElement) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      const originalContent = buttonElement.innerHTML;
      buttonElement.innerHTML = 'Copied!';
      buttonElement.disabled = true;
      setTimeout(() => {
        buttonElement.innerHTML = originalContent;
        buttonElement.disabled = false;
      }, 2000);
    }).catch(err => {
      console.error('Modern copy failed: ', err);
      alert('Could not copy text.');
    });
  } else {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed"; textArea.style.top = "0"; textArea.style.left = "0";
    textArea.style.opacity = "0";
    document.body.appendChild(textArea);
    textArea.focus(); textArea.select();
    try {
      const successful = document.execCommand('copy');
      if (successful) {
        const originalContent = buttonElement.innerHTML;
        buttonElement.innerHTML = 'Copied!';
        buttonElement.disabled = true;
        setTimeout(() => {
          buttonElement.innerHTML = originalContent;
          buttonElement.disabled = false;
        }, 2000);
      } else {
         console.error('Fallback copy command failed');
         alert('Could not copy text.');
      }
    } catch (err) {
      console.error('Fallback copy error: ', err);
      alert('Could not copy text.');
    }
    document.body.removeChild(textArea);
  }
}
